services:
  mcp-server:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app-tier
    ports:
      # Published on the host's loopback only.
      - "127.0.0.1:13080:13080"
    volumes:
      - slack_cache:/home/app/.cache/slack-mcp-server
    env_file:
      - .env
    environment:
      # The server must listen on all container interfaces for the published
      # port to reach it. A non-loopback bind requires SLACK_MCP_API_KEY to be
      # set (in .env).
      SLACK_MCP_HOST: "0.0.0.0"
      SLACK_MCP_PORT: "13080"

volumes:
  slack_cache:

networks:
  app-tier:
    name: app-tier
    external: true
